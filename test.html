<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScanNote Pro">
<link rel="manifest" href="manifest.json">
<title>ScanNote Pro</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#f1f5f9;padding-bottom:70px}
header{padding:14px 16px;background:#1e293b;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:1.1rem}
.badge{background:#3b82f6;color:#fff;font-size:12px;padding:3px 8px;border-radius:20px}
.page{display:none;padding:16px}
.page.on{display:block}
.card{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-size:16px;font-weight:700;margin-bottom:8px}
.btn:active{opacity:.8}
.btn2{background:transparent;border:1px solid #334155;color:#f1f5f9}
.btn3{background:#ef4444}
.btn-sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;border-top:1px solid #334155;padding-bottom:8px}
nav button{flex:1;background:0;border:0;color:#94a3b8;padding:10px 2px;font-size:11px}
nav button.on{color:#3b82f6}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:#1e293b;border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;color:#3b82f6}
.stat span{font-size:12px;color:#94a3b8}
#box{width:100%;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;margin-bottom:10px;position:relative}
#video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60%;aspect-ratio:1;border:3px solid #3b82f6;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.4);pointer-events:none}
.row{display:flex;gap:8px}
.row .btn{flex:1}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;margin-bottom:10px;box-sizing:border-box}
.item{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:8px}
.item b{word-break:break-all}
.item small{display:block;color:#94a3b8;font-size:12px;margin-top:4px}
.tag{display:inline-block;background:#3b82f6;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#334155;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:99;display:none}
.toast.on{display:block}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:flex-end}
.modal.on{display:flex}
.modal .in{background:#1e293b;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 28px;max-height:70vh;overflow:auto}
.cat{display:block;width:100%;padding:14px;margin:0 0 8px;border:1px solid #334155;border-radius:12px;background:#0f172a;color:#fff;font-size:16px;font-weight:700;text-align:left;box-sizing:border-box}
.muted{color:#94a3b8;font-size:14px}
.sw{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #334155}
.toko{border:1px solid #334155;border-radius:12px;margin-bottom:12px;overflow:hidden}
.toko-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0f172a;gap:8px}
.toko-h b{font-size:14px}
.toko-h .cnt{background:#3b82f6;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.toko-h .copyall{background:#334155;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.toko-b{padding:6px 10px}
.id-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #334155}
.id-row:last-child{border-bottom:0}
.id-row .txt{flex:1;word-break:break-all;font-size:13px}
.id-row .txt small{display:block;color:#94a3b8;font-size:11px;margin-top:2px}
.id-row .cp{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;flex-shrink:0}
.empty-toko{padding:10px 12px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>
<header>
  <b>ScanNote Pro</b>
  <span class="badge" id="badge">0</span>
</header>
<div class="toast" id="toast"></div>

<div class="page on" id="home">
  <div class="stat">
    <div><b id="nToday">0</b><span>Hari ini</span></div>
    <div><b id="nTotal">0</b><span>Total</span></div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">Scan Terakhir</div>
    <div id="last" class="muted">Belum ada</div>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:10px">ID per Toko</div>
    <div id="perToko" class="muted">Belum ada data</div>
  </div>
  <button class="btn" onclick="go('scan')">Mulai Scan</button>
  <button class="btn btn2" onclick="go('search')">Cari Data</button>
</div>

<div class="page" id="scan">
  <div class="row" style="margin-bottom:10px">
    <button class="btn" id="btnFast" onclick="setMode('fast')" style="margin:0">Cepat</button>
    <button class="btn btn2" id="btnOnce" onclick="setMode('once')" style="margin:0">Sekali</button>
  </div>
  <div id="box">
    <video id="video" playsinline muted></video>
    <div class="frame"></div>
  </div>
  <div class="row">
    <button class="btn btn2" onclick="flash()">Flash</button>
    <button class="btn btn2" onclick="zoom()">Zoom</button>
    <button class="btn" id="btnCam" onclick="cam()">Mulai</button>
  </div>
  <p class="muted" style="text-align:center" id="status">Tekan Mulai</p>
</div>

<div class="page" id="search">
  <input id="q" placeholder="Cari ID..." oninput="cari()">
  <button class="btn" onclick="cari()">Cari</button>
  <div id="hasilCari"></div>
</div>

<div class="page" id="history">
  <select id="fCat" onchange="hist()"></select>
  <input id="fQ" placeholder="Filter ID..." oninput="hist()">
  <button class="btn btn2 btn-sm" onclick="go('recycle')">Recycle Bin</button>
  <button class="btn btn2 btn-sm" onclick="hapusSemua()">Hapus Semua</button>
  <div id="hasilHist" style="margin-top:10px"></div>
</div>

<div class="page" id="share">
  <div class="card">
    <select id="sCat"></select>
    <button class="btn" onclick="wa()">WhatsApp</button>
    <button class="btn btn2" onclick="csv()">Unduh CSV</button>
    <button class="btn btn2" onclick="txt()">Unduh TXT</button>
  </div>
</div>

<div class="page" id="settings">
  <div class="card">
    <div style="font-weight:700;margin-bottom:8px">Kelola Toko</div>
    <div id="listCat"></div>
    <input id="newCat" placeholder="Nama toko baru">
    <button class="btn" onclick="addCat()">Tambah Toko</button>
  </div>
  <div class="card">
    <div class="sw" onclick="tog('sound')"><span>Suara</span><span id="sSound">ON</span></div>
    <div class="sw" onclick="tog('vibrate')"><span>Getar</span><span id="sVibrate">ON</span></div>
    <div class="sw" onclick="tog('anti')"><span>Anti Scan Ganda</span><span id="sAnti">ON</span></div>
  </div>
  <div class="card">
    <button class="btn btn2" onclick="backup()">Backup</button>
    <button class="btn btn2" onclick="document.getElementById('file').click()">Restore</button>
    <input type="file" id="file" accept=".json" style="display:none" onchange="restore(event)">
  </div>
</div>

<div class="page" id="recycle">
  <button class="btn btn2" onclick="go('history')">Kembali</button>
  <div id="hasilRec"></div>
</div>

<div class="modal" id="modal">
  <div class="in">
    <h3 style="text-align:center;margin:0 0 6px">Pilih Toko</h3>
    <p class="muted" style="text-align:center" id="modalId">-</p>
    <div id="modalCat"></div>
    <button class="btn btn2" onclick="closeModal()">Batal</button>
  </div>
</div>

<nav>
  <button class="on" id="n-home" onclick="go('home')">Home</button>
  <button id="n-scan" onclick="go('scan')">Scan</button>
  <button id="n-search" onclick="go('search')">Cari</button>
  <button id="n-history" onclick="go('history')">Riwayat</button>
  <button id="n-share" onclick="go('share')">Share</button>
  <button id="n-settings" onclick="go('settings')">Set</button>
</nav>

<script>
  var scans=[], recycle=[], cats=["ACC","Davis","Pampam","Calista","Davis Mall"];
var set={sound:1,vibrate:1,anti:1};
var mode="fast", scanning=0, stream=null, det=null, last="", lastT=0, track=null, timer=null, pending=null, torchOn=0, zoomLv=1;

try{
  var a=localStorage.getItem("sn1"); if(a) scans=JSON.parse(a);
  var b=localStorage.getItem("sn2"); if(b) recycle=JSON.parse(b);
  var c=localStorage.getItem("sn3"); if(c) cats=JSON.parse(c);
  var d=localStorage.getItem("sn4"); if(d) set=JSON.parse(d);
}catch(e){}

function save(){
  localStorage.setItem("sn1",JSON.stringify(scans));
  localStorage.setItem("sn2",JSON.stringify(recycle));
  localStorage.setItem("sn3",JSON.stringify(cats));
  localStorage.setItem("sn4",JSON.stringify(set));
  stat();
}

function go(p){
  var ps=["home","scan","search","history","share","settings","recycle"];
  for(var i=0;i<ps.length;i++){
    document.getElementById(ps[i]).className="page"+(ps[i]==p?" on":"");
    var n=document.getElementById("n-"+ps[i]);
    if(n) n.className=(ps[i]==p?"on":"");
  }
  if(p!="scan" && scanning) stop();
  if(p=="history"){ fill(); hist(); }
  if(p=="home"){ stat(); lastScan(); perToko(); }
  if(p=="recycle") rec();
  if(p=="settings") listToko();
  if(p=="share") fill();
}

function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.className="toast on";
  setTimeout(function(){t.className="toast";},2000);
}

function buzz(ok){
  if(set.vibrate && navigator.vibrate) navigator.vibrate(ok?40:80);
}

function copyText(text){
  if(!text) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Disalin: "+text.substring(0,24)+(text.length>24?"...":""));
      buzz(1);
    }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.left="-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); toast("Disalin"); buzz(1); }
  catch(e){ toast("Gagal salin"); }
  document.body.removeChild(ta);
}

function stat(){
  var today=new Date().toDateString(), n=0;
  for(var i=0;i<scans.length;i++) if(new Date(scans[i].ts).toDateString()==today) n++;
  document.getElementById("nToday").textContent=n;
  document.getElementById("nTotal").textContent=scans.length;
  document.getElementById("badge").textContent=scans.length;
}

function lastScan(){
  var el=document.getElementById("last");
  if(!scans.length){ el.innerHTML="Belum ada"; return; }
  var s=scans[0];
  el.innerHTML="<b onclick=\"copyText('"+escAttr(s.id)+"')\" style=\"cursor:pointer\">"+esc(s.id)+"</b><small>"+tgl(s.ts)+"</small>"+(s.cat?"<div class='tag'>"+esc(s.cat)+"</div>":"")+"<div style=\"margin-top:8px\"><button class=\"btn btn-sm\" onclick=\"copyText('"+escAttr(s.id)+"')\">Salin ID</button></div>";
}

function perToko(){
  var el=document.getElementById("perToko");
  if(!cats.length){ el.innerHTML="Belum ada toko"; return; }

  var map={};
  for(var i=0;i<cats.length;i++) map[cats[i]]=[];
  for(var j=0;j<scans.length;j++){
    var s=scans[j];
    if(s.cat && map[s.cat]) map[s.cat].push(s);
  }

  var h="";
  for(var k=0;k<cats.length;k++){
    var name=cats[k];
    var list=map[name]||[];
    h+="<div class='toko'>";
    h+="<div class='toko-h'><div><b>"+esc(name)+"</b> <span class='cnt'>"+list.length+" ID</span></div>";
    if(list.length){
      h+="<button type='button' class='copyall' onclick=\"copyToko('"+escAttr(name)+"')\">Salin semua</button>";
    }
    h+="</div>";
    if(!list.length){
      h+="<div class='empty-toko'>Belum ada scan</div>";
    } else {
      h+="<div class='toko-b'>";
      for(var m=0;m<list.length;m++){
        h+="<div class='id-row'>";
        h+="<div class='txt' onclick=\"copyText('"+escAttr(list[m].id)+"')\">"+esc(list[m].id)+"<small>"+tgl(list[m].ts)+"</small></div>";
        h+="<button type='button' class='cp' onclick=\"copyText('"+escAttr(list[m].id)+"')\">Salin</button>";
        h+="</div>";
      }
      h+="</div>";
    }
    h+="</div>";
  }
  el.innerHTML=h;
    }
  function copyToko(name){
  var ids=[];
  for(var i=0;i<scans.length;i++){
    if(scans[i].cat===name) ids.push(scans[i].id);
  }
  if(!ids.length){ toast("Kosong"); return; }
  copyText(ids.join("\n"));
}

function setMode(m){
  mode=m;
  document.getElementById("btnFast").className="btn"+(m=="fast"?"":" btn2");
  document.getElementById("btnOnce").className="btn"+(m=="once"?"":" btn2");
  document.getElementById("btnFast").style.margin="0";
  document.getElementById("btnOnce").style.margin="0";
}

function cam(){ if(scanning) stop(); else start(); }

function start(){
  if(!window.BarcodeDetector){ toast("Pakai Chrome"); return; }
  if(!cats.length){ toast("Tambah toko dulu"); return; }
  if(!det){
    try{ det=new BarcodeDetector({formats:["qr_code","ean_13","code_128"]}); }
    catch(e){ try{ det=new BarcodeDetector({formats:["qr_code"]}); }catch(e2){ toast("Scanner error"); return; } }
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(s){
    stream=s;
    var v=document.getElementById("video");
    v.srcObject=s; v.play();
    track=s.getVideoTracks()[0];
    scanning=1;
    document.getElementById("btnCam").textContent="Stop";
    document.getElementById("status").textContent="Arahkan ke barcode...";
    timer=setInterval(tick,300);
  }).catch(function(){ toast("Gagal kamera"); });
}

function stop(){
  scanning=0;
  if(timer) clearInterval(timer); timer=null;
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
  document.getElementById("video").srcObject=null;
  document.getElementById("btnCam").textContent="Mulai";
  document.getElementById("status").textContent="Berhenti";
}

function tick(){
  if(!scanning||!det) return;
  var v=document.getElementById("video");
  if(v.readyState<2) return;
  det.detect(v).then(function(cs){
    if(cs&&cs.length){
      var r=(cs[0].rawValue||"").trim();
      if(r) onScan(r, cs[0].format||"qr");
    }
  }).catch(function(){});
}

function onScan(raw, fmt){
  var now=Date.now();
  if(set.anti){
    if(raw==last && now-lastT<2500) return;
    for(var i=0;i<scans.length;i++){
      if(scans[i].id==raw){
        document.getElementById("status").textContent="Sudah ada";
        toast("ID sudah ada"); buzz(0);
        last=raw; lastT=now;
        if(mode=="once") stop();
        return;
      }
    }
  }
  last=raw; lastT=now;
  if(timer){ clearInterval(timer); timer=null; }
  pending={id:raw,type:fmt,ts:now};
  openModal(raw);
  if(mode=="once") stop();
}
  function openModal(id){
  document.getElementById("modalId").textContent=id;
  var box=document.getElementById("modalCat");
  box.innerHTML="";
  for(var i=0;i<cats.length;i++){
    var b=document.createElement("button");
    b.className="cat";
    b.textContent=cats[i];
    b.setAttribute("data-c",cats[i]);
    b.onclick=function(){ pick(this.getAttribute("data-c")); };
    box.appendChild(b);
  }
  document.getElementById("modal").className="modal on";
  buzz(1);
}

function closeModal(){
  document.getElementById("modal").className="modal";
  pending=null;
  if(scanning && mode=="fast" && !timer) timer=setInterval(tick,300);
}

function pick(cat){
  if(!pending) return;
  pending.cat=cat;
  scans.unshift(pending);
  save();
  toast("Masuk: "+cat);
  document.getElementById("status").textContent="OK: "+cat;
  pending=null;
  document.getElementById("modal").className="modal";
  if(scanning && mode=="fast") timer=setInterval(tick,300);
}

function flash(){
  if(!track) return;
  try{
    var c=track.getCapabilities();
    if(!c.torch){ toast("No flash"); return; }
    torchOn=!torchOn;
    track.applyConstraints({advanced:[{torch:torchOn}]});
  }catch(e){ toast("Flash error"); }
}

function zoom(){
  if(!track) return;
  try{
    var c=track.getCapabilities();
    if(!c.zoom){ toast("No zoom"); return; }
    var mn=c.zoom.min||1, mx=c.zoom.max||3;
    zoomLv=zoomLv>=mx?mn:Math.min(mx,zoomLv+0.5);
    track.applyConstraints({advanced:[{zoom:zoomLv}]});
  }catch(e){ toast("Zoom error"); }
}

function cari(){
  var q=(document.getElementById("q").value||"").toLowerCase().trim();
  var box=document.getElementById("hasilCari"), h="";
  if(!q){ box.innerHTML=""; return; }
  for(var i=0;i<scans.length;i++){
    if(scans[i].id.toLowerCase().indexOf(q)>=0) h+=item(scans[i],0);
  }
  box.innerHTML=h||"<div class='muted' style='padding:20px;text-align:center'>Tidak ditemukan</div>";
}

function item(s, del){
  return "<div class='item'><b>"+esc(s.id)+"</b><small>"+tgl(s.ts)+"</small>"+
    (s.cat?"<div class='tag'>"+esc(s.cat)+"</div>":"")+
    "<div style='margin-top:8px'><button class='btn btn-sm' onclick=\"copyText('"+escAttr(s.id)+"')\">Salin</button> "+
    (del?"<button class='btn btn3 btn-sm' onclick='del("+s.ts+")'>Hapus</button>":"")+
    "</div></div>";
}

function fill(){
  var o="<option value=''>Semua Toko</option>";
  for(var i=0;i<cats.length;i++) o+="<option value='"+esc(cats[i])+"'>"+esc(cats[i])+"</option>";
  var a=document.getElementById("fCat"), b=document.getElementById("sCat");
  var va=a.value, vb=b.value;
  a.innerHTML=o; b.innerHTML=o;
  a.value=va; b.value=vb;
}
function hist(){
  var q=(document.getElementById("fQ").value||"").toLowerCase().trim();
  var cat=document.getElementById("fCat").value||"";
  var h="";
  for(var i=0;i<scans.length;i++){
    var s=scans[i];
    if(cat && s.cat!=cat) continue;
    if(q && s.id.toLowerCase().indexOf(q)<0) continue;
    h+=item(s,1);
  }
  document.getElementById("hasilHist").innerHTML=h||"<div class='muted' style='padding:20px;text-align:center'>Kosong</div>";
}

function del(ts){
  for(var i=0;i<scans.length;i++){
    if(scans[i].ts==ts){ recycle.unshift(scans[i]); scans.splice(i,1); break; }
  }
  save(); hist(); toast("Ke recycle");
}

function hapusSemua(){
  if(!scans.length) return;
  if(!confirm("Pindah semua ke Recycle?")) return;
  recycle=scans.concat(recycle); scans=[]; save(); hist(); toast("OK");
}

function rec(){
  var box=document.getElementById("hasilRec");
  if(!recycle.length){ box.innerHTML="<div class='muted' style='padding:20px;text-align:center'>Kosong</div>"; return; }
  var h="<button class='btn btn3' onclick='kosong()'>Kosongkan</button>";
  for(var i=0;i<recycle.length;i++){
    var s=recycle[i];
    h+="<div class='item'><b>"+esc(s.id)+"</b><small>"+tgl(s.ts)+(s.cat?" · "+esc(s.cat):"")+"</small>"+
      "<div style='margin-top:8px'><button class='btn btn-sm' onclick='balik("+s.ts+")'>Balik</button> "+
      "<button class='btn btn3 btn-sm' onclick='buang("+s.ts+")'>Hapus</button></div></div>";
  }
  box.innerHTML=h;
}

function balik(ts){
  for(var i=0;i<recycle.length;i++){
    if(recycle[i].ts==ts){ scans.unshift(recycle[i]); recycle.splice(i,1); break; }
  }
  save(); rec(); toast("Dipulihkan");
}

function buang(ts){
  var n=[];
  for(var i=0;i<recycle.length;i++) if(recycle[i].ts!=ts) n.push(recycle[i]);
  recycle=n; save(); rec(); toast("Dihapus");
}

function kosong(){
  if(!confirm("Hapus permanen?")) return;
  recycle=[]; save(); rec(); toast("Kosong");
}

function dataShare(){
  var cat=document.getElementById("sCat").value||"", r=[];
  for(var i=0;i<scans.length;i++) if(!cat||scans[i].cat==cat) r.push(scans[i]);
  return r;
}

function wa(){
  var list=dataShare();
  if(!list.length){ toast("Kosong"); return; }
  var t="ScanNote Pro%0A%0A";
  for(var i=0;i<Math.min(list.length,40);i++){
    t+=(i+1)+". "+encodeURIComponent(list[i].id);
    if(list[i].cat) t+=" ("+encodeURIComponent(list[i].cat)+")";
    t+="%0A";
  }
  window.open("https://wa.me/?text="+t,"_blank");
}

function csv(){
  var list=dataShare();
  if(!list.length){ toast("Kosong"); return; }
  var c="ID,Toko,Type,Date\n";
  for(var i=0;i<list.length;i++){
    var s=list[i];
    c+='"'+s.id.replace(/"/g,'""')+'","'+(s.cat||'')+'",'+s.type+',"'+new Date(s.ts).toLocaleString('id-ID')+'"\n';
  }
  unduh("scannote.csv",c,"text/csv"); toast("CSV OK");
}

function txt(){
  var list=dataShare();
  if(!list.length){ toast("Kosong"); return; }
  var t="ScanNote Pro\n\n";
  for(var i=0;i<list.length;i++) t+=(i+1)+". "+list[i].id+" | "+(list[i].cat||"-")+"\n";
  unduh("scannote.txt",t,"text/plain"); toast("TXT OK");
    }
  function unduh(n,c,t){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([c],{type:t}));
  a.download=n; a.click();
}

function backup(){
  unduh("backup.json",JSON.stringify({scans:scans,recycle:recycle,cats:cats,set:set},null,2),"application/json");
  toast("Backup OK");
}

function restore(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.scans) scans=d.scans;
      if(d.recycle) recycle=d.recycle;
      if(d.cats) cats=d.cats;
      if(d.set) set=d.set;
      save(); sw(); fill(); perToko(); toast("Restore OK");
    }catch(err){ toast("File invalid"); }
  };
  r.readAsText(f); e.target.value="";
}

function listToko(){
  var box=document.getElementById("listCat"), h="";
  for(var i=0;i<cats.length;i++){
    h+="<div style='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155'>"+
      "<span>"+esc(cats[i])+"</span><button class='btn btn3 btn-sm' onclick='delCat("+i+")'>Hapus</button></div>";
  }
  box.innerHTML=h||"<div class='muted'>Belum ada</div>";
}

function addCat(){
  var n=(document.getElementById("newCat").value||"").trim();
  if(!n){ toast("Isi nama"); return; }
  if(cats.indexOf(n)>=0){ toast("Sudah ada"); return; }
  cats.push(n); save();
  document.getElementById("newCat").value="";
  listToko(); fill(); toast("Ditambah");
}

function delCat(i){
  if(!confirm("Hapus toko?")) return;
  cats.splice(i,1); save(); listToko(); fill(); toast("Dihapus");
}

function tog(k){
  set[k]=set[k]?0:1; save(); sw();
}

function sw(){
  document.getElementById("sSound").textContent=set.sound?"ON":"OFF";
  document.getElementById("sVibrate").textContent=set.vibrate?"ON":"OFF";
  document.getElementById("sAnti").textContent=set.anti?"ON":"OFF";
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function tgl(ts){ return new Date(ts).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

sw(); stat(); lastScan(); perToko(); fill();
</script>
</body>
</html>
