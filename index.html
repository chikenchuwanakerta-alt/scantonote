<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScanNote Pro">
  <title>ScanNote Pro</title>
  <link rel="manifest" href="data:application/json,{'name':'ScanNote%20Pro','short_name':'ScanNote','start_url':'.','display':'standalone','background_color':'%230f172a','theme_color':'%230f172a','icons':[{'src':'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%233b82f6%22 width=%22100%22 height=%22100%22 rx=%2220%22/><text y=%22.9em%22 font-size=%2270%22 x=%2250%25%22 text-anchor=%22middle%22 fill=%22white%22>📷</text></svg>','sizes':'any','type':'image/svg+xml'}]}">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
      --nav: #1e293b;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e2e8f0;
      --nav: #ffffff;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 72px;
      transition: background .25s, color .25s;
    }
    header {
      position: sticky; top:0; z-index:40;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header .badge {
      font-size: .7rem; background: var(--primary); color:#fff;
      padding: 3px 8px; border-radius: 20px;
    }
    .page { display: none; padding: 16px; max-width: 520px; margin: 0 auto; }
    .page.active { display: block; animation: fade .25s ease; }
    @keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card h3 { font-size: .95rem; margin-bottom: 10px; }
    .muted { color: var(--muted); font-size: .85rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px 16px; border: none; border-radius: 12px;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      background: var(--primary); color: #fff;
      transition: transform .12s, opacity .12s;
    }
    .btn:active { transform: scale(.97); opacity: .9; }
    .btn-outline {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-sm { padding: 8px 12px; font-size: .8rem; width: auto; border-radius: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row .btn { flex: 1; min-width: 120px; }

    /* Bottom Nav */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--nav);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0,0,0,.15);
    }
    nav button {
      flex: 1; background: none; border: none; color: var(--muted);
      font-size: .65rem; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 2px; cursor: pointer;
    }
    nav button.active { color: var(--primary); }
    nav button span { font-size: 1.25rem; }

    /* Scanner */
    #scannerBox {
      position: relative; width: 100%; aspect-ratio: 3/4;
      background: #000; border-radius: 16px; overflow: hidden;
      margin-bottom: 14px;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #scanOverlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .scan-frame {
      width: 70%; max-width: 260px; aspect-ratio: 1;
      border: 3px solid var(--primary);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
    }
    .scan-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .scan-controls .btn { flex: 1; min-width: 90px; padding: 10px; font-size: .85rem; }
    .mode-toggle {
      display: flex; background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); overflow: hidden; margin-bottom: 12px;
    }
    .mode-toggle button {
      flex: 1; padding: 10px; border: none; background: transparent;
      color: var(--muted); font-weight: 600; font-size: .85rem; cursor: pointer;
    }
    .mode-toggle button.active { background: var(--primary); color: #fff; }

    /* List items */
    .item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .item .id { font-weight: 700; font-size: .95rem; word-break: break-all; }
    .item .meta { font-size: .75rem; color: var(--muted); margin-top: 4px; }
    .item .actions { display: flex; gap: 6px; flex-shrink: 0; }

    .day-header {
      font-size: .8rem; font-weight: 700; color: var(--muted);
      margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: center;
    }
    input, select, textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: .95rem; margin-bottom: 12px;
    }
    .switch-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .switch-row:last-child { border-bottom: none; }
    .switch {
      width: 48px; height: 28px; background: var(--border); border-radius: 20px;
      position: relative; cursor: pointer; transition: .2s;
    }
    .switch.on { background: var(--primary); }
    .switch::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; background: #fff; border-radius: 50%;
      transition: .2s;
    }
    .switch.on::after { left: 23px; }

    .toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-size: .9rem; font-weight: 600; opacity: 0; visibility: hidden;
      transition: .3s; z-index: 9999; max-width: 90%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: var(--success); }
    .toast.err { background: var(--danger); }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; text-align: center;
    }
    .stat .num { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
    .stat .lbl { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    #resultDetail { display: none; }
    #resultDetail.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>ScanNote Pro</h1>
    <span class="badge" id="scanCountBadge">0 scan</span>
  </header>

  <!-- DASHBOARD -->
  <div id="page-home" class="page active">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="statToday">0</div><div class="lbl">Hari ini</div></div>
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    </div>
    <div class="card">
      <h3>📌 Scan Terakhir</h3>
      <div id="lastScanBox" class="muted">Belum ada scan.</div>
    </div>
    <button class="btn" onclick="go('scan')">📷 Mulai Scan</button>
    <div style="height:10px"></div>
    <button class="btn btn-outline" onclick="go('search')">🔎 Cari Data</button>
  </div>

  <!-- SCANNER -->
  <div id="page-scan" class="page">
    <div class="mode-toggle">
      <button id="modeFast" class="active" onclick="setMode('fast')">Scan Cepat</button>
      <button id="modeOnce" onclick="setMode('once')">Scan Sekali</button>
    </div>
    <div id="scannerBox">
      <video id="video" playsinline muted></video>
      <div id="scanOverlay"><div class="scan-frame"></div></div>
    </div>
    <div class="scan-controls">
      <button class="btn btn-outline" id="btnFlash" onclick="toggleFlash()">🔦 Flash</button>
      <button class="btn btn-outline" id="btnZoom" onclick="cycleZoom()">🔍 Zoom</button>
      <button class="btn" id="btnStartStop" onclick="toggleCamera()">▶ Mulai</button>
    </div>
    <p class="muted" style="text-align:center;font-size:.8rem" id="scanStatus">Tekan Mulai untuk scan</p>
  </div>

  <!-- SEARCH -->
  <div id="page-search" class="page">
    <input type="text" id="searchInput" placeholder="Cari berdasarkan ID..." oninput="doSearch()">
    <button class="btn" onclick="doSearch()">🔎 Cari</button>
    <div style="height:14px"></div>
    <div id="searchResult"></div>
  </div>

  <!-- HISTORY -->
  <div id="page-history" class="page">
    <input type="text" id="historyFilter" placeholder="Filter riwayat..." oninput="renderHistory()">
    <div class="row" style="margin-bottom:12px">
      <button class="btn btn-outline btn-sm" onclick="showRecycle()">🗑️ Recycle Bin</button>
      <button class="btn btn-outline btn-sm" onclick="clearAllConfirm()">Hapus Semua</button>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- SHARE -->
  <div id="page-share" class="page">
    <div class="card">
      <h3>📤 Bagikan Data</h3>
      <p class="muted" style="margin-bottom:14px">Pilih format yang diinginkan</p>
      <button class="btn" style="margin-bottom:10px" onclick="shareWA()">WhatsApp</button>
      <button class="btn btn-outline" style="margin-bottom:10px" onclick="exportCSV()">Unduh CSV</button>
      <button class="btn btn-outline" onclick="exportTXT()">Unduh TXT</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="page-settings" class="page">
    <div class="card">
      <h3>🎨 Tema</h3>
      <div class="mode-toggle" style="margin-bottom:0">
        <button id="themeDark" onclick="setTheme('dark')">Gelap</button>
        <button id="themeLight" onclick="setTheme('light')">Terang</button>
        <button id="themeSystem" onclick="setTheme('system')">Sistem</button>
      </div>
    </div>
    <div class="card">
      <div class="switch-row">
        <span>🔊 Suara</span>
        <div class="switch" id="swSound" onclick="toggleSetting('sound')"></div>
      </div>
      <div class="switch-row">
        <span>📳 Getar</span>
        <div class="switch" id="swVibrate" onclick="toggleSetting('vibrate')"></div>
      </div>
      <div class="switch-row">
        <span>📅 Tampilkan Tanggal</span>
        <div class="switch" id="swDate" onclick="toggleSetting('showDate')"></div>
      </div>
      <div class="switch-row">
        <span>🚫 Anti Scan Ganda</span>
        <div class="switch" id="swAnti" onclick="toggleSetting('antiDuplicate')"></div>
      </div>
    </div>
    <div class="card">
      <h3>💾 Backup & Restore</h3>
      <button class="btn btn-outline" style="margin-bottom:10px" onclick="backupData()">Backup JSON</button>
      <button class="btn btn-outline" onclick="document.getElementById('restoreFile').click()">Restore JSON</button>
      <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="restoreData(event)">
    </div>
    <div class="card">
      <p class="muted" style="text-align:center;font-size:.8rem">ScanNote Pro v1.0<br>Data disimpan di perangkat ini</p>
    </div>
  </div>

  <!-- RECYCLE (overlay page) -->
  <div id="page-recycle" class="page">
    <button class="btn btn-outline" style="margin-bottom:14px" onclick="go('history')">← Kembali ke Riwayat</button>
    <div id="recycleList"></div>
  </div>

  <nav>
    <button class="active" data-page="home" onclick="go('home')"><span>🏠</span>Home</button>
    <button data-page="scan" onclick="go('scan')"><span>📷</span>Scan</button>
    <button data-page="search" onclick="go('search')"><span>🔎</span>Cari</button>
    <button data-page="history" onclick="go('history')"><span>📜</span>Riwayat</button>
    <button data-page="share" onclick="go('share')"><span>📤</span>Share</button>
    <button data-page="settings" onclick="go('settings')"><span>⚙️</span>Set</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script>
    // ========== STATE ==========
    let scans = JSON.parse(localStorage.getItem('sn_scans') || '[]');
    let recycle = JSON.parse(localStorage.getItem('sn_recycle') || '[]');
    let settings = JSON.parse(localStorage.getItem('sn_settings') || '{"sound":true,"vibrate":true,"showDate":true,"antiDuplicate":true,"theme":"system"}');
    let scanMode = 'fast'; // fast | once
    let scanning = false;
    let stream = null;
    let detector = null;
    let lastScanned = '';
    let lastScanTime = 0;
    let zoomLevel = 1;
    let torchOn = false;
    let videoTrack = null;
    let detectLoop = null;

    // ========== INIT ==========
    function init() {
      applyTheme();
      updateSwitches();
      updateStats();
      renderLastScan();
      renderHistory();
      if ('BarcodeDetector' in window) {
        BarcodeDetector.getSupportedFormats().then(f => {
          detector = new BarcodeDetector({ formats: f.length ? f : ['qr_code','ean_13','code_128','code_39'] });
        }).catch(() => { detector = new BarcodeDetector({ formats: ['qr_code'] }); });
      }
    }

    // ========== NAV ==========
    function go(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.toggle('active', b.dataset.page === page);
      });
      if (page !== 'scan' && scanning) stopCamera();
      if (page === 'history') renderHistory();
      if (page === 'home') { updateStats(); renderLastScan(); }
    }

    // ========== THEME ==========
    function setTheme(t) {
      settings.theme = t;
      saveSettings();
      applyTheme();
      document.getElementById('themeDark').classList.toggle('active', t === 'dark');
      document.getElementById('themeLight').classList.toggle('active', t === 'light');
      document.getElementById('themeSystem').classList.toggle('active', t === 'system');
    }
    function applyTheme() {
      let t = settings.theme;
      if (t === 'system') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f8fafc' : '#0f172a';
      document.getElementById('themeDark').classList.toggle('active', settings.theme === 'dark');
      document.getElementById('themeLight').classList.toggle('active', settings.theme === 'light');
      document.getElementById('themeSystem').classList.toggle('active', settings.theme === 'system');
    }
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (settings.theme === 'system') applyTheme();
    });

    // ========== SETTINGS ==========
    function toggleSetting(key) {
      settings[key] = !settings[key];
      saveSettings();
      updateSwitches();
    }
    function updateSwitches() {
      ['sound','vibrate','showDate','antiDuplicate'].forEach(k => {
        const el = document.getElementById('sw' + k.charAt(0).toUpperCase() + k.slice(1));
        if (el) el.classList.toggle('on', !!settings[k]);
      });
      // special ids
      document.getElementById('swSound').classList.toggle('on', settings.sound);
      document.getElementById('swVibrate').classList.toggle('on', settings.vibrate);
      document.getElementById('swDate').classList.toggle('on', settings.showDate);
      document.getElementById('swAnti').classList.toggle('on', settings.antiDuplicate);
    }
    function saveSettings() {
      localStorage.setItem('sn_settings', JSON.stringify(settings));
    }

    // ========== STORAGE ==========
    function saveScans() {
      localStorage.setItem('sn_scans', JSON.stringify(scans));
      localStorage.setItem('sn_recycle', JSON.stringify(recycle));
      updateStats();
    }

    // ========== FEEDBACK ==========
    function toast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    function feedback(ok) {
      if (settings.vibrate && navigator.vibrate) {
        navigator.vibrate(ok ? [40, 30, 40] : [80, 50, 80]);
      }
      if (settings.sound) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = ok ? 880 : 220;
          g.gain.value = 0.08;
          o.start();
          setTimeout(() => { o.stop(); ctx.close(); }, ok ? 120 : 250);
        } catch(e) {}
      }
    }

    // ========== STATS & LAST ==========
    function updateStats() {
      const today = new Date().toDateString();
      const todayCount = scans.filter(s => new Date(s.ts).toDateString() === today).length;
      document.getElementById('statToday').textContent = todayCount;
      document.getElementById('statTotal').textContent = scans.length;
      document.getElementById('scanCountBadge').textContent = scans.length + ' scan';
    }
    function renderLastScan() {
      const box = document.getElementById('lastScanBox');
      if (!scans.length) {
        box.innerHTML = '<span class="muted">Belum ada scan.</span>';
        return;
      }
      const s = scans[0];
      box.innerHTML = `
        <div class="id" style="font-weight:700;word-break:break-all">${escapeHtml(s.id)}</div>
        <div class="meta">${formatTime(s.ts)} · ${s.type || 'code'}</div>
      `;
    }

    // ========== SCANNER ==========
    function setMode(m) {
      scanMode = m;
      document.getElementById('modeFast').classList.toggle('active', m === 'fast');
      document.getElementById('modeOnce').classList.toggle('active', m === 'once');
    }

    async function toggleCamera() {
      if (scanning) stopCamera();
      else await startCamera();
    }

    async function startCamera() {
      if (!detector) {
        toast('BarcodeDetector tidak didukung di browser ini', 'err');
        feedback(false);
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        const video = document.getElementById('v
