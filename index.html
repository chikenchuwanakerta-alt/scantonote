<script>
  var currentLocation="Mencari lokasi...";
var currentAddress="Mencari alamat...";
  // scans = Home (belum di-salin) | riwayat = Riwayat (sudah di-salin) | recycle = Recycle Bin
  var scans=[], riwayat=[], recycle=[], cats=["ACC","Davis","Pampam","Calista","Davis Mall"];
  // ===== FOTO =====
var photoStream = null;
var photoTrack = null;
var photos = [];
  // ===== DATABASE FOTO =====
var photoDB = null;
var set={sound:1,vibrate:1,anti:1};
var mode="fast", scanning=0, stream=null, last="", lastT=0, track=null, pending=null, torchOn=0, zoomLv=1, scanTimer=null, zxReader=null, zxReader1D=null, nativeDet=null, bdBusy=0;

try{
  var a=localStorage.getItem("sn1"); if(a) scans=JSON.parse(a);
  var b=localStorage.getItem("sn2"); if(b) recycle=JSON.parse(b);
  var c=localStorage.getItem("sn3"); if(c) cats=JSON.parse(c);
  var d=localStorage.getItem("sn4"); if(d) set=JSON.parse(d);
  var e=localStorage.getItem("sn5"); if(e) riwayat=JSON.parse(e);
}catch(e){}

function save(){
  localStorage.setItem("sn1",JSON.stringify(scans));
  localStorage.setItem("sn2",JSON.stringify(recycle));
  localStorage.setItem("sn3",JSON.stringify(cats));
  localStorage.setItem("sn4",JSON.stringify(set));
  localStorage.setItem("sn5",JSON.stringify(riwayat));
  stat();
}

var currentPage="home";
var navPages=["home","scan","history","share","photo","settings"];

function go(p){
  if(p==="search") p="history";
  var ps=["home","scan","history","share","photo","settings","recycle"];
  for(var i=0;i<ps.length;i++){
    var el=document.getElementById(ps[i]);
    if(el) el.className="page"+(ps[i]==p?" on":"");
    var n=document.getElementById("n-"+ps[i]);
    if(n) n.className=(ps[i]==p?"on":"");
  }
  currentPage=p;
  if(p!="scan" && scanning) stop();
  if(p=="history"){ fill(); hist(); }
  if(p=="home"){ stat(); perToko(); }
  if(p=="recycle") rec();
  if(p=="settings") listToko();
  if(p=="share") fill();
}

// ===== SWIPE NAVIGASI =====
var swipeX=0, swipeY=0, swipeT=0, swipeActive=0;

function swipeStart(e){
  // Jangan swipe kalau lagi di input / modal / kamera scroll
  var t=e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT" || t.closest && (t.closest(".modal") || t.closest("#box") || t.closest("nav")))) return;
  var touch=e.touches ? e.touches[0] : e;
  swipeX=touch.clientX;
  swipeY=touch.clientY;
  swipeT=Date.now();
  swipeActive=1;
}

function swipeEnd(e){
  if(!swipeActive) return;
  swipeActive=0;
  var touch=e.changedTouches ? e.changedTouches[0] : e;
  var dx=touch.clientX - swipeX;
  var dy=touch.clientY - swipeY;
  var dt=Date.now() - swipeT;
  // Minimal 60px horizontal, lebih horizontal daripada vertical, max 500ms
  if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.2 || dt>500) return;
  // Recycle tidak ikut swipe
  if(currentPage==="recycle") return;
  var idx=navPages.indexOf(currentPage);
  if(idx<0) return;
  if(dx<0 && idx<navPages.length-1){
    // swipe kiri → halaman berikutnya
    go(navPages[idx+1]);
  } else if(dx>0 && idx>0){
    // swipe kanan → halaman sebelumnya
    go(navPages[idx-1]);
  }
}

document.addEventListener("touchstart", swipeStart, {passive:true});
document.addEventListener("touchend", swipeEnd, {passive:true});

function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.className="toast on";
  setTimeout(function(){t.className="toast";},2000);
}

function buzz(ok) {
  if (set.vibrate && navigator.vibrate) navigator.vibrate(ok ? 40 : 80);
  playBeep(ok);   // ← tambah baris ini
}

function copyText(text){
  if(!text) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("Disalin: "+text.substring(0,24)+(text.length>24?"...":""));
      buzz(1);
    }).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.left="-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); toast("Disalin"); buzz(1); }
  catch(e){ toast("Gagal salin"); }
  document.body.removeChild(ta);
}

function stat(){
  // badge dihapus
}

function perToko(){
  var el=document.getElementById("perToko");
  if(!cats.length){ el.innerHTML="Belum ada toko"; return; }

  var map={};
  for(var i=0;i<cats.length;i++) map[cats[i]]=[];
  for(var j=0;j<scans.length;j++){
    var s=scans[j];
    if(s.cat && map[s.cat]) map[s.cat].push(s);
  }

  var h="";
  for(var k=0;k<cats.length;k++){
    var name=cats[k];
    var list=map[name]||[];
    h+="<div class='toko'>";
    h+="<div class='toko-h'><div><b>"+esc(name)+"</b> <span class='cnt'>"+list.length+" ID</span></div>";
    if(list.length){
      h+="<button type='button' class='copyall' onclick=\"copyToko('"+escAttr(name)+"')\">Salin semua</button>";
    }
    h+="</div>";
    if(!list.length){
      h+="<div class='empty-toko'>Belum ada scan</div>";
    } else {
      h+="<div class='toko-b'>";
      for(var m=0;m<list.length;m++){
        h+="<div class='id-row'>";
        h+="<div class='txt' onclick=\"salinHome("+list[m].ts+")\">"+esc(list[m].id)+"<small>"+tgl(list[m].ts)+"</small></div>";
        h+="<button type='button' class='cp' onclick=\"salinHome("+list[m].ts+")\">Salin</button>";
        h+="<button type='button' class='del' onclick=\"delHome("+list[m].ts+")\">Hapus</button>";
        h+="</div>";
      }
      h+="</div>";
    }
    h+="</div>";
  }
  el.innerHTML=h;
}

function salinHome(ts){
  var item=null, idx=-1;
  for(var i=0;i<scans.length;i++){
    if(scans[i].ts==ts){ item=scans[i]; idx=i; break; }
  }
  if(!item) return;
  copyText(item.id);
  scans.splice(idx,1);
  riwayat.unshift(item);
  save();
  perToko();
  toast("Pindah ke Riwayat");
}

function copyToko(name){
  var ids=[], keep=[];
  for(var i=0;i<scans.length;i++){
    if(scans[i].cat===name){
      ids.push(scans[i].id);
      riwayat.unshift(scans[i]);
    } else {
      keep.push(scans[i]);
    }
  }
  if(!ids.length){ toast("Kosong"); return; }
  scans=keep;
  save();
  perToko();
  copyText(ids.join("\n"));
  toast("Pindah ke Riwayat");
}

function setMode(m){
  mode=m;
  document.getElementById("btnFast").className="btn"+(m=="fast"?"":" btn2");
  document.getElementById("btnOnce").className="btn"+(m=="once"?"":" btn2");
  document.getElementById("btnFast").style.margin="0";
  document.getElementById("btnOnce").style.margin="0";
}

function cam(){ if(scanning) stop(); else start(); }

function playBeep(ok){
  if(!set.sound) return;
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var now=ctx.currentTime;
    // Dua oscillator = suara lebih keras & jelas di speaker HP
    function tone(freq, start, dur, vol){
      var o=ctx.createOscillator();
      var g=ctx.createGain();
      o.type="square";
      o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, now+start);
      g.gain.exponentialRampToValueAtTime(vol, now+start+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start);
      o.stop(now+start+dur+0.02);
    }
    if(ok){
      // Beep sukses: 2 nada tinggi, keras
      tone(1200, 0, 0.12, 0.55);
      tone(1500, 0.12, 0.14, 0.6);
    }else{
      // Beep gagal/sudah ada: nada rendah
      tone(300, 0, 0.18, 0.5);
      tone(220, 0.16, 0.22, 0.45);
    }
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 500);
  }catch(e){}
}

function initZxReader(){
  if(zxReader) return zxReader;
  if(typeof ZXing==="undefined") return null;
  try{
    var hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR
    ]);
    // TRY_HARDER hanya di path lambat
    hints.set(ZXing.DecodeHintType.TRY_HARDER, false);
    zxReader=new ZXing.MultiFormatReader();
    zxReader.setHints(hints);
    return zxReader;
  }catch(e){
    console.error("initZxReader", e);
    return null;
  }
}

// Reader khusus 1D — prioritas Code 128, lebih ringan & sering dipanggil
function initZxReader1D(){
  if(zxReader1D) return zxReader1D;
  if(typeof ZXing==="undefined") return null;
  try{
    var hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxReader1D=new ZXing.MultiFormatReader();
    zxReader1D.setHints(hints);
    return zxReader1D;
  }catch(e){
    console.error("initZxReader1D", e);
    return null;
  }
}

function initCode128Reader(){
  if(typeof ZXing==="undefined" || !ZXing.Code128Reader) return null;
  try{
    return new ZXing.Code128Reader();
  }catch(e){ return null; }
}

// Native Chrome BarcodeDetector — mirip kecepatan app native
function initNativeDetector(){
  if(nativeDet) return nativeDet;
  if(typeof BarcodeDetector==="undefined") return null;
  var formatLists=[
    ["qr_code","code_128","code_39","ean_13","ean_8","upc_a","upc_e","itf","codabar"],
    ["qr_code","code_128","code_39","ean_13"],
    ["qr_code","code_128"],
    ["qr_code"]
  ];
  for(var i=0;i<formatLists.length;i++){
    try{
      nativeDet=new BarcodeDetector({ formats: formatLists[i] });
      console.log("BarcodeDetector OK:", formatLists[i].join(","));
      return nativeDet;
    }catch(e){}
  }
  try{
    nativeDet=new BarcodeDetector();
    console.log("BarcodeDetector OK: default formats");
    return nativeDet;
  }catch(e){
    console.log("BarcodeDetector tidak tersedia");
    nativeDet=null;
    return null;
  }
}

function applyFastFocus(tr, forceSingle){
  if(!tr || !tr.applyConstraints) return;
  try{
    var caps = tr.getCapabilities ? tr.getCapabilities() : {};
    var adv = [];
    var settings = tr.getSettings ? tr.getSettings() : {};

    // 1) Continuous autofocus (paling penting untuk scan cepat)
    if(caps.focusMode && caps.focusMode.indexOf){
      if(forceSingle && caps.focusMode.indexOf("single-shot") >= 0){
        // Tap-to-focus: single-shot dulu biar re-lock cepat, lalu continuous
        adv.push({ focusMode: "single-shot" });
      } else if(caps.focusMode.indexOf("continuous") >= 0){
        adv.push({ focusMode: "continuous" });
      } else if(caps.focusMode.indexOf("single-shot") >= 0){
        adv.push({ focusMode: "single-shot" });
      }
    }

    // 2) Fokus ke titik tengah + sedikit sebaran (bantu barcode di tengah)
    if(caps.pointsOfInterest){
      adv.push({
        pointsOfInterest: [
          { x: 0.5, y: 0.5 },
          { x: 0.42, y: 0.48 },
          { x: 0.58, y: 0.52 }
        ]
      });
    }

    // 3) Exposure continuous + white balance continuous (kontras bar lebih bagus)
    if(caps.exposureMode && caps.exposureMode.indexOf && caps.exposureMode.indexOf("continuous") >= 0){
      adv.push({ exposureMode: "continuous" });
    }
    if(caps.whiteBalanceMode && caps.whiteBalanceMode.indexOf && caps.whiteBalanceMode.indexOf("continuous") >= 0){
      adv.push({ whiteBalanceMode: "continuous" });
    }

    // 4) Focus distance (kalau support) → jarak dekat ideal barcode (~0.15-0.4m)
    if(caps.focusDistance){
      var fd = caps.focusDistance;
      var nearIdeal = 0.25; // meter
      if(typeof fd.min === "number" && typeof fd.max === "number"){
        nearIdeal = Math.max(fd.min, Math.min(fd.max, 0.25));
        adv.push({ focusDistance: nearIdeal });
      }
    }

    // Apply advanced dulu
    if(adv.length){
      tr.applyConstraints({ advanced: adv }).catch(function(){});
    }

    // 5) Plain constraints (beberapa device Android lebih patuh di level ini)
    var plain = {};
    if(caps.focusMode && caps.focusMode.indexOf){
      if(forceSingle && caps.focusMode.indexOf("single-shot") >= 0){
        plain.focusMode = "single-shot";
      } else if(caps.focusMode.indexOf("continuous") >= 0){
        plain.focusMode = "continuous";
      }
    }
    if(caps.pointsOfInterest){
      plain.pointsOfInterest = [{ x: 0.5, y: 0.5 }];
    }
    if(Object.keys(plain).length){
      tr.applyConstraints(plain).catch(function(){});
    }

    // 6) Setelah single-shot (tap), kembalikan ke continuous secepatnya
    if(forceSingle && caps.focusMode && caps.focusMode.indexOf("continuous") >= 0){
      setTimeout(function(){
        try{
          tr.applyConstraints({
            advanced: [{ focusMode: "continuous", pointsOfInterest: [{ x: 0.5, y: 0.5 }] }]
          }).catch(function(){});
          tr.applyConstraints({ focusMode: "continuous" }).catch(function(){});
        }catch(e){}
      }, 350);
    }
  }catch(e){
    console.log("focus constrain skip", e);
  }
}

    }catch(e){}

    navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:"environment" }, width:{ ideal:960 }, height:{ ideal:540 }, frameRate:{ ideal:24 } }
    }).then(function(s){
      stream=s;
      var v=document.getElementById("video");
      v.srcObject=s;
      v.setAttribute("playsinline","true");
      v.muted=true;
      var playP=v.play();
      if(playP && playP.catch) playP.catch(function(){});
      track=s.getVideoTracks()[0]||null;
      applyFastFocus(track);
      setTimeout(function(){ applyFastFocus(track, true); }, 400);
      setTimeout(function(){ applyFastFocus(track); }, 900);
      initZxReader();

      document.getElementById("status").textContent="Arahkan ke barcode...";

var tickCount=0;

// Naikkan kontras + sedikit sharpen biar garis Code 128 lebih tajam
function enhanceCanvas(srcCanvas){
  var w=srcCanvas.width, h=srcCanvas.height;
  var out=document.createElement("canvas");
  out.width=w; out.height=h;
  var ctx=out.getContext("2d", { willReadFrequently:true });
  ctx.drawImage(srcCanvas, 0, 0);
  try{
    var img=ctx.getImageData(0, 0, w, h);
    var d=img.data;
    // contrast boost
    var factor=1.45;
    var intercept=128*(1-factor);
    for(var i=0;i<d.length;i+=4){
      var g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      // threshold soft biar bar lebih hitam/putih
      var v=g*factor+intercept;
      if(v<90) v=0;
      else if(v>165) v=255;
      v=v<0?0:v>255?255:v;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(img, 0, 0);
  }catch(e){}
  return out;
}

function decodeOnce(reader, source){
  if(!reader || !source) return null;
  try{
    var bb=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
    return reader.decode(bb);
  }catch(e){
    try{ reader.reset(); }catch(e2){}
    try{
      var bb2=new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(source));
      return reader.decode(bb2);
    }catch(e3){
      try{ reader.reset(); }catch(e4){}
      return null;
    }
  }
}

function decodeCode128Direct(source){
  try{
    var r=initCode128Reader();
    if(!r) return null;
    var bb=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
    return r.decode(bb);
  }catch(e){
    try{
      var r2=initCode128Reader();
      if(!r2) return null;
      var bb2=new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(source));
      return r2.decode(bb2);
    }catch(e2){ return null; }
  }
}

function tryAllReaders(source){
  var result=null;
  // 1) Code128 native — paling akurat utk resi SPX/J&T
  result=decodeCode128Direct(source);
  if(result) return result;
  // 2) MultiFormat 1D
  result=decodeOnce(initZxReader1D(), source);
  if(result) return result;
  // 3) invert
  try{
    var inv=source.invert();
    result=decodeCode128Direct(inv);
    if(result) return result;
    result=decodeOnce(initZxReader1D(), inv);
  }catch(e){}
  return result;
}

function tickScan(){
  if(!scanning) return;
  var v=document.getElementById("video");
  var canvas=document.getElementById("scanCanvas");
  if(!v || !canvas || v.readyState<2) return;

  var w=v.videoWidth, h=v.videoHeight;
  if(!w || !h) return;

  tickCount++;

  // Redmi 9 / budget: pulse single-shot tiap ~1.2s, continuous tiap 0.6s
  if(tickCount%12===0 && track){
    try{
      // Setiap 24 tick (~1.2s) pakai force single-shot biar AF re-lock
      applyFastFocus(track, tickCount%24===0);
    }catch(e){}
  }

  // ===== 1) NATIVE BarcodeDetector (QR + format yg support) — super cepat =====
  if(nativeDet && !bdBusy){
    bdBusy=1;
    nativeDet.detect(v).then(function(codes){
      bdBusy=0;
      if(!scanning || !codes || !codes.length) return;
      var c=codes[0];
      var raw=(c.rawValue||"").trim();
      if(raw) onScan(raw, c.format||"code");
    }).catch(function(){ bdBusy=0; });
  }

  // Canvas scale — 800px balance speed/akurasi Code128
  var maxW=800;
  var scale=w>maxW ? maxW/w : 1;
  var cw=Math.floor(w*scale);
  var ch=Math.floor(h*scale);
  canvas.width=cw;
  canvas.height=ch;
  var ctx=canvas.getContext("2d", { willReadFrequently:true });
  ctx.drawImage(v, 0, 0, cw, ch);

  if(tickCount%15===0){
    document.getElementById("status").textContent="Sedang scan... ("+tickCount+")";
  }

  var result=null;

  // ===== 2) Code 128: 2 strip per tick (tinggi sensitivitas) =====
  var ratios=[0.18, 0.26, 0.34, 0.42];
  var yShifts=[0, -0.08, 0.08, -0.16, 0.16, -0.24, 0.24];
  for(var s=0; s<2 && !result; s++){
    try{
      var ri=(tickCount+s) % ratios.length;
      var yi=(tickCount*2+s) % yShifts.length;
      var stripH=Math.max(48, Math.floor(ch*ratios[ri]));
      var stripY=Math.floor((ch-stripH)/2 + ch*yShifts[yi]);
      stripY=Math.max(0, Math.min(ch-stripH, stripY));

      var cStrip=document.createElement("canvas");
      cStrip.width=cw;
      cStrip.height=stripH;
      cStrip.getContext("2d").drawImage(canvas, 0, stripY, cw, stripH, 0, 0, cw, stripH);

      // enhance tiap strip ganjil, plain di genap (bergiliran)
      var src=(tickCount+s)%2===0 ? enhanceCanvas(cStrip) : cStrip;
      var ls=new ZXing.HTMLCanvasElementLuminanceSource(src);
      result=tryAllReaders(ls);
    }catch(e){}
  }

  // ===== 3) Full frame QR + fallback — tiap 2 tick =====
  if(!result && tickCount%2===0){
    try{
      var srcF=(tickCount%4===0) ? enhanceCanvas(canvas) : canvas;
      var lsF=new ZXing.HTMLCanvasElementLuminanceSource(srcF);
      result=tryAllReaders(lsF);
      if(!result){
        result=decodeOnce(initZxReader(), lsF);
      }
      if(!result){
        try{
          var inv=lsF.invert();
          result=decodeOnce(initZxReader(), inv);
        }catch(e){}
      }
    }catch(e){}
  }

  if(result){
    var raw="";
    try{ raw=(result.getText && result.getText()) || result.text || ""; }catch(e){ raw=result.text||""; }
    raw=(raw||"").trim();
    if(raw){
      var fmt="code";
      try{
        if(result.getBarcodeFormat) fmt=String(result.getBarcodeFormat());
        else if(result.format) fmt=String(result.format);
      }catch(e){}
      onScan(raw, fmt);
    }
  }
}

function inputManual(){
  var el=document.getElementById("manualId");
  var raw=(el.value||"").trim();
  if(!raw){
    toast("Isi ID dulu");
    return;
  }
  if(!cats.length){
    toast("Tambah toko dulu");
    return;
  }
  // Reuse alur yang sama dengan hasil scan
  onScan(raw, "manual");
  el.value="";
  el.blur();
}

function onScan(raw, fmt){
  var now=Date.now();
  if(set.anti){
    if(raw==last && now-lastT<1500) return;
    var exists=0;
    for(var i=0;i<scans.length;i++){ if(scans[i].id==raw){ exists=1; break; } }
    if(!exists) for(var i=0;i<riwayat.length;i++){ if(riwayat[i].id==raw){ exists=1; break; } }
    if(exists){
      document.getElementById("status").textContent="Sudah ada";
      toast("ID sudah ada");
      buzz(0);
      last=raw; lastT=now;
      if(mode=="once") stop();
      return;
    }
  }
  last=raw; lastT=now;

  // Pause loop saat modal
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }

  pending={id:raw,type:fmt,ts:now};
  openModal(raw);
  if(mode=="once") stop();
}

function openModal(id){
  document.getElementById("modalId").textContent=id;
  var box=document.getElementById("modalCat");
  box.innerHTML="";
  for(var i=0;i<cats.length;i++){
    var b=document.createElement("button");
    b.className="cat";
    b.textContent=cats[i];
    b.setAttribute("data-c",cats[i]);
    b.onclick=function(){ pick(this.getAttribute("data-c")); };
    box.appendChild(b);
  }
  document.getElementById("modal").className="modal on";
  buzz(1);
}

function closeModal(){
  document.getElementById("modal").className="modal";
  pending=null;
  if(scanning && mode=="fast") resumeScan();
}

function pick(cat){
  if(!pending) return;
  pending.cat=cat;
  scans.unshift(pending);
  save();
  toast("Masuk: "+cat);
  document.getElementById("status").textContent="OK: "+cat;
  pending=null;
  document.getElementById("modal").className="modal";
  if(scanning && mode=="fast") resumeScan();
}

function resumeScan(){
  if(!scanning) return;
  document.getElementById("status").textContent="Arahkan ke barcode...";
  if(!scanTimer) scanTimer=setInterval(tickScan, 50);
}

function flash(){
  if(!track){
    try{
      var v=document.getElementById("video");
      if(v && v.srcObject) track=v.srcObject.getVideoTracks()[0];
    }catch(e){}
  }
  if(!track){ toast("Kamera belum siap"); return; }
  try{
    var c=track.getCapabilities ? track.getCapabilities() : {};
    if(!c.torch){ toast("No flash"); return; }
    torchOn=!torchOn;
    track.applyConstraints({advanced:[{torch:torchOn}]});
  }catch(e){ toast("Flash error"); }
}

function zoom(){
  if(!track){
    try{
      var v=document.getElementById("video");
      if(v && v.srcObject) track=v.srcObject.getVideoTracks()[0];
    }catch(e){}
  }
  if(!track){ toast("Kamera belum siap"); return; }
  try{
    var c=track.getCapabilities ? track.getCapabilities() : {};
    if(!c.zoom){ toast("No zoom"); return; }
    var mn=c.zoom.min||1, mx=c.zoom.max||3;
    zoomLv=zoomLv>=mx?mn:Math.min(mx,zoomLv+0.5);
    track.applyConstraints({advanced:[{zoom:zoomLv}]});
  }catch(e){ toast("Zoom error"); }
}

function cari(){
  var q=(document.getElementById("q").value||"").toLowerCase().trim();
  var box=document.getElementById("hasilCari"), h="";
  if(!q){ box.innerHTML=""; return; }
  // Cari di Home + Riwayat + Recycle Bin
  function addHit(s, lokasi){
    h+="<div class='item'><b>"+esc(s.id)+"</b><small>"+tgl(s.ts)+" · "+lokasi+"</small>"+
      (s.cat?"<div class='tag'>"+esc(s.cat)+"</div>":"")+
      "<div style='margin-top:8px'><button class='btn btn-sm' onclick=\"copyText('"+escAttr(s.id)+"')\">Salin</button></div></div>";
  }
  for(var i=0;i<scans.length;i++){
    if(scans[i].id.toLowerCase().indexOf(q)>=0) addHit(scans[i],"Home");
  }
  for(var i=0;i<riwayat.length;i++){
    if(riwayat[i].id.toLowerCase().indexOf(q)>=0) addHit(riwayat[i],"Riwayat");
  }
  for(var i=0;i<recycle.length;i++){
    if(recycle[i].id.toLowerCase().indexOf(q)>=0) addHit(recycle[i],"Recycle");
  }
  box.innerHTML=h||"<div class='muted' style='padding:12px;text-align:center'>Tidak ditemukan</div>";
}

function hist(){

  var h="";
  for(var i=0;i<riwayat.length;i++){
    var s=riwayat[i];
    if(cat && s.cat!=cat) continue;
    h+=item(s,1);

function del(ts){
  // Hapus dari Riwayat → Recycle
  for(var i=0;i<riwayat.length;i++){
    if(riwayat[i].ts==ts){ recycle.unshift(riwayat[i]); riwayat.splice(i,1); break; }
  }
  save(); hist(); toast("Ke recycle");
}

function delHome(ts){
  // Hapus dari Home → langsung Recycle (tidak masuk Riwayat)
  for(var i=0;i<scans.length;i++){
    if(scans[i].ts==ts){ recycle.unshift(scans[i]); scans.splice(i,1); break; }
  }
  save();
  perToko();
  toast("Ke recycle");
}

function hapusSemua(){
  // Hapus semua di Riwayat → Recycle
  if(!riwayat.length) return;
  if(!confirm("Pindah semua ke Recycle?")) return;
  recycle=riwayat.concat(recycle); riwayat=[]; save(); hist(); toast("OK");
}

function rec(){
  var box=document.getElementById("hasilRec");
  if(!recycle.length){ box.innerHTML="<div class='muted' style='padding:20px;text-align:center'>Kosong</div>"; return; }
  var h="<button class='btn btn3' onclick='kosong()'>Kosongkan</button>";
  for(var i=0;i<recycle.length;i++){
    var s=recycle[i];
    h+="<div class='item'><b>"+esc(s.id)+"</b><small>"+tgl(s.ts)+(s.cat?" · "+esc(s.cat):"")+"</small>"+
      "<div style='margin-top:8px'><button class='btn btn-sm' onclick='balik("+s.ts+")'>Balik</button> "+
      "<button class='btn btn3 btn-sm' onclick='buang("+s.ts+")'>Hapus</button></div></div>";
  }
  box.innerHTML=h;
}

function balik(ts){
  // Pulihkan ke Riwayat
  for(var i=0;i<recycle.length;i++){
    if(recycle[i].ts==ts){ riwayat.unshift(recycle[i]); recycle.splice(i,1); break; }
  }
  save(); rec(); toast("Dipulihkan");
}

function buang(ts){
  var n=[];
  for(var i=0;i<recycle.length;i++) if(recycle[i].ts!=ts) n.push(recycle[i]);
  recycle=n; save(); rec(); toast("Dihapus");
}

function kosong(){
  if(!confirm("Hapus permanen?")) return;
  recycle=[]; save(); rec(); toast("Kosong");
}

function dataShare(){
  // Share dari Riwayat (ID yang sudah di-salin)
  var cat=document.getElementById("sCat").value||"", r=[];
  for(var i=0;i<riwayat.length;i++) if(!cat||riwayat[i].cat==cat) r.push(riwayat[i]);
  return r;
}

function wa(){
  var list=dataShare();
  if(!list.length){ toast("Kosong"); return; }
  var t="ScanNote Pro%0A%0A";
  for(var i=0;i<Math.min(list.length,40);i++){
    t+=(i+1)+". "+encodeURIComponent(list[i].id);
    if(list[i].cat) t+=" ("+encodeURIComponent(list[i].cat)+")";
    t+="%0A";
  }
  window.open("https://wa.me/?text="+t,"_blank");
}

function txt(){
  var list=dataShare();
  if(!list.length){ toast("Kosong"); return; }
  var t="ScanNote Pro\n\n";
  for(var i=0;i<list.length;i++) t+=(i+1)+". "+list[i].id+" | "+(list[i].cat||"-")+"\n";
  unduh("scannote.txt",t,"text/plain"); toast("TXT OK");
    }
  function unduh(n,c,t){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([c],{type:t}));
  a.download=n; a.click();
}

function backup(){
  unduh("backup.json",JSON.stringify({scans:scans,riwayat:riwayat,recycle:recycle,cats:cats,set:set},null,2),"application/json");
  toast("Backup OK");
}

function restore(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.scans) scans=d.scans;
      if(d.riwayat) riwayat=d.riwayat;
      if(d.recycle) recycle=d.recycle;
      if(d.cats) cats=d.cats;
      if(d.set) set=d.set;
      save(); sw(); fill(); perToko(); toast("Restore OK");
    }catch(err){ toast("File invalid"); }
  };
  r.readAsText(f); e.target.value="";
}

function listToko(){
  var box=document.getElementById("listCat"), h="";
  for(var i=0;i<cats.length;i++){
    h+="<div style='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155'>"+
      "<span>"+esc(cats[i])+"</span><button class='btn btn3 btn-sm' onclick='delCat("+i+")'>Hapus</button></div>";
  }
  box.innerHTML=h||"<div class='muted'>Belum ada</div>";
}

function addCat(){
  var n=(document.getElementById("newCat").value||"").trim();
  if(!n){ toast("Isi nama"); return; }
  if(cats.indexOf(n)>=0){ toast("Sudah ada"); return; }
  cats.push(n); save();
  document.getElementById("newCat").value="";
  listToko(); fill(); toast("Ditambah");
}

function delCat(i){
  if(!confirm("Hapus toko?")) return;
  cats.splice(i,1); save(); listToko(); fill(); toast("Dihapus");
}

function tog(k){
  set[k]=set[k]?0:1; save(); sw();
}

function sw(){
  document.getElementById("sSound").textContent=set.sound?"ON":"OFF";
  document.getElementById("sVibrate").textContent=set.vibrate?"ON":"OFF";
  document.getElementById("sAnti").textContent=set.anti?"ON":"OFF";
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function tgl(ts){ return new Date(ts).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

async function takePhoto(){

var video=document.getElementById("photoVideo");

var canvas=document.getElementById("photoCanvas");

canvas.width=video.videoWidth;

canvas.height=video.videoHeight;

var ctx=canvas.getContext("2d");

ctx.drawImage(video,0,0);

var lokasi=currentLocation;

var now=new Date();

var hari=[
"Minggu",
"Senin",
"Selasa",
"Rabu",
"Kamis",
"Jumat",
"Sabtu"
];

var tanggal=
hari[now.getDay()]+" | "+
now.toLocaleDateString("id-ID")+" | "+
now.toLocaleTimeString("id-ID");

ctx.fillStyle="rgba(0,0,0,.55)";
ctx.fillRect(
0,
canvas.height-170,
canvas.width,
170
);

ctx.fillStyle="#ffffff";

ctx.font="bold 26px sans-serif";

ctx.fillText(
tanggal,
20,
canvas.height-125
);

ctx.fillStyle="#ffffff";
ctx.font="18px sans-serif";

wrapText(
ctx,
lokasi,
20,
canvas.height-85,
canvas.width-40,
24
);

var img=canvas.toDataURL(
"image/jpeg",
0.85
);

savePhoto({

image:img,

time:Date.now(),

lokasi:lokasi

});

toast("Foto berhasil disimpan");

}
  function wrapText(ctx,text,x,y,maxWidth,lineHeight){

var words=text.split(" ");
var line="";

for(var n=0;n<words.length;n++){

var testLine=line+words[n]+" ";
var testWidth=ctx.measureText(testLine).width;

if(testWidth>maxWidth && n>0){

ctx.fillText(line,x,y);

line=words[n]+" ";

y+=lineHeight;

}else{

line=testLine;

}

}

ctx.fillText(line,x,y);

  }
  async function getLocationText(){

return new Promise(function(resolve){

if(!navigator.geolocation){

resolve("Lokasi tidak tersedia");

return;

}

navigator.geolocation.getCurrentPosition(

async function(pos){

var lat=pos.coords.latitude;
var lng=pos.coords.longitude;

if(navigator.onLine){

try{

try{

const controller = new AbortController();

const timer = setTimeout(function(){
    controller.abort();
},3000);

var r = await fetch(
"https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lng,
{
signal: controller.signal,
headers:{
"Accept":"application/json"
}
});

clearTimeout(timer);

var j = await r.json();

resolve(j.display_name || lat.toFixed(6)+", "+lng.toFixed(6));

}catch(e){

// Kalau gagal, jangan tunggu lama
resolve(lat.toFixed(6)+", "+lng.toFixed(6));

}

}catch(e){

resolve(lat.toFixed(6)+", "+lng.toFixed(6));

}

}else{

resolve(lat.toFixed(6)+", "+lng.toFixed(6));

}

},

function(){

resolve("Lokasi tidak tersedia");

},

{

enableHighAccuracy:true,
timeout:5000

}

);

});

  }

// INDEXED DB
// ==========================

function initPhotoDB(){

var req=indexedDB.open("ScanNotePhotoDB",1);

req.onupgradeneeded=function(e){

photoDB=e.target.result;

if(!photoDB.objectStoreNames.contains("photos")){

photoDB.createObjectStore("photos",{
keyPath:"id",
autoIncrement:true
});

}

};

req.onsuccess=function(e){

photoDB=e.target.result;

loadPhotos();

};

req.onerror=function(){

toast("Database gagal dibuat");

};

}

function savePhoto(data){

if(!photoDB) return;

var tx=photoDB.transaction(["photos"],"readwrite");

var store=tx.objectStore("photos");

store.add(data);

tx.oncomplete=function(){

loadPhotos();

};

}

function loadPhotos(){

if(!photoDB) return;

photos=[];

var tx=photoDB.transaction(["photos"],"readonly");

var store=tx.objectStore("photos");

store.openCursor().onsuccess=function(e){

var c=e.target.result;

if(c){

photos.unshift(c.value);

c.continue();

}else{

refreshGallery();

}

};

}

function deletePhoto(id){

var tx=photoDB.transaction(["photos"],"readwrite");

tx.objectStore("photos").delete(id);

tx.oncomplete=function(){

loadPhotos();

toast("Foto dihapus");

};

  }
sw();

stat();

perToko();

fill();

initPhotoDB();
